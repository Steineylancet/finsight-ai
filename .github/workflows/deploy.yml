name: FinSight AI — CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          AZURE_OPENAI_ENDPOINT: https://dummy.openai.azure.com/
          AZURE_OPENAI_API_KEY: dummy-key
          AZURE_OPENAI_API_VERSION: 2024-12-01-preview
          AZURE_OPENAI_CHAT_DEPLOYMENT: gpt-4o
          AZURE_OPENAI_EMBEDDING_DEPLOYMENT: text-embedding-ada-002
          AZURE_OPENAI_MINI_DEPLOYMENT: gpt-5.4-mini
          AZURE_OPENAI_FULL_DEPLOYMENT: gpt-4o
          AZURE_SEARCH_ENDPOINT: https://dummy.search.windows.net
          AZURE_SEARCH_API_KEY: dummy-key
          AZURE_SEARCH_INDEX_NAME: finsight-index
          # Real credential (not dummy) — DataLoader downloads the planning/GL
          # CSVs from Blob Storage at app startup since they're gitignored
          # (100MB+, not checked out in CI), so this needs to actually resolve.
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          AZURE_STORAGE_CONTAINER_NAME: financial-data

  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set app settings (before deploy)
        run: |
          az webapp config appsettings set \
            --name finsight-ai-app \
            --resource-group finsight-ai-rg \
            --settings \
              SCM_DO_BUILD_DURING_DEPLOYMENT="true" \
              AZURE_OPENAI_ENDPOINT="${{ secrets.AZURE_OPENAI_ENDPOINT }}" \
              AZURE_OPENAI_API_KEY="${{ secrets.AZURE_OPENAI_API_KEY }}" \
              AZURE_OPENAI_API_VERSION="2024-12-01-preview" \
              AZURE_OPENAI_CHAT_DEPLOYMENT="gpt-4o" \
              AZURE_OPENAI_EMBEDDING_DEPLOYMENT="text-embedding-ada-002" \
              AZURE_OPENAI_MINI_DEPLOYMENT="gpt-5.4-mini" \
              AZURE_OPENAI_FULL_DEPLOYMENT="gpt-4o" \
              AZURE_SEARCH_ENDPOINT="${{ secrets.AZURE_SEARCH_ENDPOINT }}" \
              AZURE_SEARCH_API_KEY="${{ secrets.AZURE_SEARCH_API_KEY }}" \
              AZURE_SEARCH_INDEX_NAME="finsight-index" \
              AZURE_STORAGE_CONNECTION_STRING="${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" \
              AZURE_STORAGE_CONTAINER_NAME="financial-data" \
            --output none

      - name: Zip app for deployment
        run: |
          zip -r app.zip . \
            -x "*.git*" \
            -x "gl_data/*" \
            -x "master_data/*" \
            -x "planning_data/*" \
            -x "__pycache__/*" \
            -x "*.pyc" \
            -x ".python_packages/*" \
            -x "ingest_log.txt" \
            -x "setup_azure.ps1"

      - name: Deploy ZIP to Azure
        run: |
          az webapp deployment source config-zip \
            --name finsight-ai-app \
            --resource-group finsight-ai-rg \
            --src app.zip \
            --timeout 600 \
            --output none
